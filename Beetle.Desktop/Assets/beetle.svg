<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Beetle's mark. Single source for the in-app vector mark (Brand.cs), the Windows icon and the
       README banner (scripts/create-app-icon.ps1). The class on each shape names its palette role,
       so the app can re-colour the mark per theme; the literal colours are the Carapace values. -->
  <rect class="tile" x="1" y="1" width="62" height="62" rx="16" fill="#182320" stroke="#3B4F44" stroke-width="1"/>
  <line class="legs" x1="22" y1="24" x2="12" y2="18" stroke="#8FD9C4" stroke-width="2.4" stroke-linecap="round"/>
  <line class="legs" x1="22" y1="34" x2="10" y2="34" stroke="#8FD9C4" stroke-width="2.4" stroke-linecap="round"/>
  <line class="legs" x1="22" y1="44" x2="12" y2="50" stroke="#8FD9C4" stroke-width="2.4" stroke-linecap="round"/>
  <line class="legs" x1="42" y1="24" x2="52" y2="18" stroke="#8FD9C4" stroke-width="2.4" stroke-linecap="round"/>
  <line class="legs" x1="42" y1="34" x2="54" y2="34" stroke="#8FD9C4" stroke-width="2.4" stroke-linecap="round"/>
  <line class="legs" x1="42" y1="44" x2="52" y2="50" stroke="#8FD9C4" stroke-width="2.4" stroke-linecap="round"/>
  <line class="legs" x1="28" y1="14" x2="23" y2="7" stroke="#8FD9C4" stroke-width="2.2" stroke-linecap="round"/>
  <line class="legs" x1="36" y1="14" x2="41" y2="7" stroke="#8FD9C4" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse class="accent" cx="32" cy="17.5" rx="8" ry="6.5" fill="#35E0B0"/>
  <ellipse class="accent" cx="32" cy="35" rx="15" ry="19" fill="#35E0B0"/>
  <line class="ink" x1="32" y1="20" x2="32" y2="50" stroke="#0B0F0E" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse class="ink" cx="25" cy="30" rx="2.5" ry="2.5" fill="#0B0F0E"/>
  <ellipse class="ink" cx="39" cy="40" rx="2.5" ry="2.5" fill="#0B0F0E"/>
</svg>
